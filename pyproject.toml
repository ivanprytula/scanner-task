[tool.poetry]
name = "scanner-task"
version = "0.1.0"
description = "Scanner Enginner task"
authors = ["ivanprytula <ivanprytula87@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
httpx = {extras = ["cli"], version = "^0.25.1"}
pydantic = "^2.4.2"
loguru = "^0.7.2"
tqdm = "^4.66.1"
pendulum = "^2.1.2"
selenium = "^4.15.2"
webdriver-manager = "^4.0.1"
python-decouple = "^3.8"
playwright = "^1.39.0"
lxml = "^4.9.3"
beautifulsoup4 = "^4.12.2"
selectolax = "^0.3.17"


[tool.poetry.group.dev.dependencies]
pre-commit = "^3.5.0"
mypy = "^1.6.1"
ruff = "^0.1.4"
pipdeptree = "^2.13.0"
icecream = "^2.1.3"
ipython = "^8.17.2"
memray = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


# ==== Mypy ====
[tool.mypy]
# The mypy configurations: https://mypy.readthedocs.io/en/latest/config_file.html
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
ignore_errors = false
ignore_missing_imports = true
implicit_reexport = false
strict_optional = true
strict_equality = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unreachable = true
disable_error_code = ['attr-defined', 'arg-type', 'type-arg', 'union-attr']
# ==== Ruff ====
[tool.ruff]
line-length = 120
target-version = "py311"
# Note: `ruff linter` to list all supported upstream linters
# Defaults: select = ["E4", "E7", "E9", "F"]
extend-select = ["W", "I", "UP", "S", "B"]
ignore = ["E501", "S105"]
